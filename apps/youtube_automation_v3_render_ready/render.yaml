# This file configures a one-click deploy for the YouTube Automation System v3.0 on Render.com.
# It sets up a PostgreSQL database, a Redis instance, a Web Service (FastAPI), and Celery workers.

services:
  - type: web
    name: youtube-automation-web
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port 10000
    envVars:
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase: 
          name: youtube-automation-db
          property: connectionString
      - key: REDIS_URL
        fromService: 
          type: redis
          name: youtube-automation-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService: 
          type: redis
          name: youtube-automation-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService: 
          type: redis
          name: youtube-automation-redis
          property: connectionString
    healthCheckPath: /health
    numInstances: 1

  - type: worker
    name: youtube-automation-celery-worker
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A tasks.celery_app worker --loglevel=info
    envVars:
      - key: DATABASE_URL
        fromDatabase: 
          name: youtube-automation-db
          property: connectionString
      - key: REDIS_URL
        fromService: 
          type: redis
          name: youtube-automation-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService: 
          type: redis
          name: youtube-automation-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService: 
          type: redis
          name: youtube-automation-redis
          property: connectionString
    numInstances: 1

  - type: worker
    name: youtube-automation-celery-beat
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A tasks.celery_app beat --loglevel=info
    envVars:
      - key: DATABASE_URL
        fromDatabase: 
          name: youtube-automation-db
          property: connectionString
      - key: REDIS_URL
        fromService: 
          type: redis
          name: youtube-automation-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService: 
          type: redis
          name: youtube-automation-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService: 
          type: redis
          name: youtube-automation-redis
          property: connectionString
    numInstances: 1

  - type: pserv
    name: youtube-automation-db
    env: postgres
    ipAllowList: [] # Adjust to your needs, e.g., only allow internal services
    plan: free # Or 'standard' for production

  - type: pserv
    name: youtube-automation-redis
    env: redis
    ipAllowList: [] # Adjust to your needs
    plan: free # Or 'standard' for production


